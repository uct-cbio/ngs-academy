---
layout: default
title: Search
permalink: /search/
---

<h2 style="margin-top: 1rem;">Search results</h2>
<div id="search-results" style="margin-top: 1rem;">
    <p>Loading…</p>
</div>

<script src="https://unpkg.com/lunr@2.3.9/lunr.min.js"></script>
<script>
(function () {
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function getQuery() {
        var params = new URLSearchParams(window.location.search);
        return (params.get('q') || '').trim();
    }

    var query = getQuery();
    var resultsEl = document.getElementById('search-results');

    var input = document.querySelector('.header-search input[name="q"]');
    if (input) input.value = query;

    if (!query) {
        resultsEl.innerHTML = '<p>Enter a search term in the box above.</p>';
        return;
    }

    document.title = 'Search: ' + query;

    fetch('{{ "/search.json" | relative_url }}')
        .then(function (r) { return r.json(); })
        .then(function (docs) {
            var idx = lunr(function () {
                this.ref('url');
                this.field('title', { boost: 10 });
                this.field('content');
                var builder = this;
                docs.forEach(function (doc) { builder.add(doc); });
            });

            var matches;
            try {
                matches = idx.query(function (q) {
                    query.split(/\s+/).filter(Boolean).forEach(function (term) {
                        var clean = term.toLowerCase().replace(/[^\w]/g, '');
                        if (!clean) return;
                        // Exact match (highest boost)
                        q.term(clean, { boost: 10 });
                        // Prefix match — "next" matches "nextflow"
                        q.term(clean, { wildcard: lunr.Query.wildcard.TRAILING, boost: 5 });
                        // Fuzzy match — "nxtflow" matches "nextflow"
                        if (clean.length > 3) {
                            q.term(clean, { editDistance: 1, boost: 1 });
                        }
                    });
                });
            } catch (e) {
                matches = [];
            }

            var byUrl = {};
            docs.forEach(function (d) { byUrl[d.url] = d; });

            if (matches.length === 0) {
                resultsEl.innerHTML = '<p>No results for <strong>' + escapeHtml(query) + '</strong>.</p>';
                return;
            }

            var html = '<p>' + matches.length + ' result(s) for <strong>' + escapeHtml(query) + '</strong></p>';
            html += '<ul style="list-style:none; padding-left:0;">';
            matches.forEach(function (m) {
                var doc = byUrl[m.ref];
                if (!doc) return;
                var snippet = doc.content ? doc.content.substring(0, 220) + '…' : '';
                html += '<li style="margin-bottom: 1.25rem;">'
                    + '<a href="' + escapeHtml(doc.url) + '" style="font-size: 16px;"><strong>'
                    + escapeHtml(doc.title) + '</strong></a>'
                    + '<div style="color:#666; font-size:13px; margin-top:4px;">'
                    + escapeHtml(snippet) + '</div>'
                    + '</li>';
            });
            html += '</ul>';
            resultsEl.innerHTML = html;
        })
        .catch(function (err) {
            resultsEl.innerHTML = '<p>Error loading search index. Check that <code>/search.json</code> built correctly.</p>';
            console.error(err);
        });
})();
</script>
